{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-lg">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Login
                    </h2>

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST">

                        <div class="mb-3">
                            <label>Email</label>

                            <input
                            type="email"
                            class="form-control"
                            name="email"
                            value="{{ request.form.get('email', '') }}"
                            required>
                        </div>

                        <div class="mb-3">
                            <label>Password</label>

                            <input
                            type="password"
                            class="form-control"
                            name="password"
                            autofocus
                            required>
                        </div>
                        <div class="form-check mt-3">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="remember"
                                id="remember">

                            <label
                                class="form-check-label"
                                for="remember">

                                Remember Me

                            </label>
                        </div>

                        <button class="btn btn-success w-100">
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
