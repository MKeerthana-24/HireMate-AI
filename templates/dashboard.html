{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="container mt-5">

    <!-- Welcome Card -->
    <div class="card shadow-lg border-0 rounded-4 p-4">

        <div class="text-center mb-4">

            <h1 class="fw-bold text-primary">
                👋 Welcome, {{ username }}
            </h1>

            <p class="text-muted fs-5">
                Practice • Improve • Get Hired
            </p>

        </div>

        <!-- Statistics -->
        <div class="row g-4">

            <!-- Total Interviews -->
            <div class="col-md-4">
                <div class="card shadow border-0 rounded-4 h-100">
                    <div class="card-body text-center">

                        <i class="bi bi-bar-chart-fill text-primary display-4"></i>

                        <h5 class="mt-3">
                            Total Interviews
                        </h5>

                        <h2 class="fw-bold">
                            {{ total }}
                        </h2>

                    </div>
                </div>
            </div>

            <!-- Last Score -->
            <div class="col-md-4">
                <div class="card shadow border-0 rounded-4 h-100">
                    <div class="card-body text-center">

                        <i class="bi bi-star-fill text-warning display-4"></i>

                        <h5 class="mt-3">
                            Last Score
                        </h5>

                        <h2 class="fw-bold">
                            {{ last }}
                        </h2>

                    </div>
                </div>
            </div>

            <!-- Last Topic -->
            <div class="col-md-4">
                <div class="card shadow border-0 rounded-4 h-100">
                    <div class="card-body text-center">

                        <i class="bi bi-laptop-fill text-success display-4"></i>

                        <h5 class="mt-3">
                            Last Topic
                        </h5>

                        <h2 class="fw-bold">
                            {{ topic }}
                        </h2>

                    </div>
                </div>
            </div>

        </div>

        <!-- Quick Actions -->
        <div class="text-center mt-5">

            <h4 class="mb-4 fw-bold">
                🚀 Quick Actions
            </h4>

            <a href="/interview"
               class="btn btn-primary btn-lg px-4 me-3 rounded-pill">
                <i class="bi bi-play-circle-fill"></i>
                Start Interview
            </a>

            <a href="/history"
               class="btn btn-success btn-lg px-4 me-3 rounded-pill">
                <i class="bi bi-clock-history"></i>
                History
            </a>

            <a href="/logout"
               class="btn btn-danger btn-lg px-4 rounded-pill">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>

    </div>

</div>

{% endblock %}
